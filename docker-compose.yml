services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: access-matrix-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - matrix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: access-matrix-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - matrix-net

networks:
  matrix-net:
    driver: bridge
