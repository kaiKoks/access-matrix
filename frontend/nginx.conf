server {
    listen 80;
    server_name _;

    # Включение сжатия gzip для быстрой загрузки скриптов и стилей
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Раздача статики React (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Если файл не найден на диске, отдавать index.html (для маршрутизации React)
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к бэкенду
    # Имя хоста 'backend' разрешается встроенным DNS-сервером Docker Compose
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Увеличенный лимит для загрузки больших файлов матриц (.xlsx)
        client_max_body_size 50m;

        # Таймауты для долгих проверок правил сетевого доступа
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
